# Render Blueprint — Lukeflow documentation site.
#
# The manual is a static VitePress build, but it is served through a small Node gate
# (server/index.mjs) so only Lukeflow operators/admins can read it. The gate validates
# the submitted credentials against core-engine `GET /api/me` (server-to-server) and
# issues a signed, HttpOnly session cookie. This is a multi-page site (not an SPA), so
# there is deliberately NO catch-all rewrite — the server resolves clean URLs to the
# built .html files and serves the generated 404.html for genuine not-founds.
services:
  - type: web
    name: luke-docs
    runtime: node
    # Only rebuild when the docs or the server actually change.
    buildFilter:
      paths:
        - "**/*.md"
        - ".vitepress/**"
        - "server/**"
        - "package.json"
        - "package-lock.json"
        - "render.yaml"
    buildCommand: npm ci && npm run docs:build
    startCommand: npm start
    healthCheckPath: /healthz
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Base URL of the deployed luke-core-engine — the identity source for the login
      # gate. Login is fail-closed (nobody in) until this is set. Set in the dashboard.
      - key: DOCS_CORE_ENGINE_URL
        sync: false
      # HMAC key that signs session cookies. Rendered as a stable random value so
      # sessions survive restarts; rotating it logs everyone out.
      - key: DOCS_SESSION_SECRET
        generateValue: true
      # Optional: also admit org-admins (a `tenant-admin` role), not just operators.
      - key: DOCS_ALLOW_TENANT_ADMIN
        value: "false"
