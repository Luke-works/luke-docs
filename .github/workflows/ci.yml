# CI — build the manual on every PR and every push to main.
# Green = the VitePress site builds and is safe to deploy. Red = something broke
# (a bad link config, a syntax error) — fix before it reaches Render.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Build (VitePress)
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the docs
        run: npm run docs:build
